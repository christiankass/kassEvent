# api.kassevent.com -> Laravel (PHP-FPM) ; app.kassevent.com -> Next.js
# En local, l'API répond sur :8080 et l'interface sur :3000 via le même Nginx.

server {
    listen 80;
    server_name api.kassevent.com api.localhost localhost;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Images du disque « public » (MEDIA_DISK=public, en local). « ^~ » : jamais transmis à PHP.
    location ^~ /storage/ {
        alias /var/www/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 81;
    server_name app.kassevent.com app.localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
