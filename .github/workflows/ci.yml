name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_pgsql, redis, zip, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Base de test (rôle sans BYPASSRLS, comme en production)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE kassevent LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'secret'"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE kassevent_test OWNER kassevent"
      - name: Style (Pint)
        run: ./vendor/bin/pint --test
      - name: Tests
        run: php artisan test
      - name: Audit des dépendances
        run: composer audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env && cp .env.example .env
      - name: Vérifie docker-compose.yml
        run: docker compose config -q
