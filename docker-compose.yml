# Environnement local et base du déploiement sur le VPS.
# Lancer : docker compose up -d --build   API : http://localhost:8080   Interface : http://localhost:3000

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  env_file: backend/.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "3000:81"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on: [api, web]
    restart: unless-stopped

  api:
    <<: *php

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "--queue=critical,notifications,default", "--tries=3"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Pages rendues par le serveur Next.js (page publique d'un événement) : API jointe dans le réseau Docker.
      API_INTERNAL_URL: http://nginx/api/v1
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      # Superutilisateur réservé à l'administration ; l'application utilise le rôle « kassevent »
      # créé par docker/postgres/initdb, soumis à la Row-Level Security.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env (identique à backend/.env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kassevent"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kassevent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Définir MINIO_ROOT_PASSWORD dans .env}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
