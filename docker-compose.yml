# Environnement local et base du déploiement sur le VPS.
# Lancer : docker compose up -d --build   API : http://localhost:8080   Interface : http://localhost:3000

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  env_file: backend/.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "3000:81"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on: [api, web]
    restart: unless-stopped

  api:
    <<: *php

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "--queue=critical,notifications,default", "--tries=3"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kassevent
      POSTGRES_USER: kassevent
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassevent"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kassevent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Définir MINIO_ROOT_PASSWORD dans .env}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
